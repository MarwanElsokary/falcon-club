name: falconclubapp
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.6+0

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # build_runner: ^2.4.7
  # State management
  flutter_bloc: ^8.1.3
  # for dependency injection
  get_it: ^7.6.4
  injectable: ^2.5.0
  # functional error handling (Either<Failure, T>) — Clean Architecture core
  fpdart: ^1.1.1
  # value equality for entities / value objects / failures
  equatable: ^2.0.7
  # Automatically generate code for converting to and from JSON by annotating Dart classes
  # Networking
  dio: ^5.3.3
  retrofit: ^4.0.3
  # retrofit_generator: ^8.0.4
  pretty_dio_logger: ^1.3.1
  bloc: ^8.1.3
  http: ^1.2.1
  #ui responsive
  flutter_screenutil: ^5.9.0
  # pic
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  #font
  google_fonts: ^6.2.1
  #auto silder
  carousel_slider: ^5.0.0
  #pinput
  pinput: ^4.0.0
  #local storge
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  #load
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1
  #transalte
  easy_localization: ^3.0.5
  #url launcher
  url_launcher: ^6.2.6
  #percent_indicator
  percent_indicator: ^4.2.5
  flutter_html: ^3.0.0-beta.2
  #cached_network_image
  cached_network_image: ^3.4.1
  #skeletonizer
  # skeletonizer: ^1.4.2
  #phoenix
  flutter_phoenix: ^1.1.1
  #countdown
  slide_countdown: ^2.0.2
  #badges
  badges: ^3.1.2
  modal_bottom_sheet: ^3.0.0
  curved_navigation_bar: ^1.0.6
  animations: ^2.0.11
  smooth_page_indicator: ^1.2.1
  freezed_annotation: ^2.4.4
  image_picker:
  flutter_rating_bar: ^4.0.1
  permission_handler: ^11.0.1
  material_symbols_icons: ^4.2719.0
  dropdown_button2: ^2.3.9
  syncfusion_flutter_sliders: ^30.1.38
  flutter_image_compress: ^2.4.0
  image_cropper: ^8.0.0
  skeletonizer: ^2.1.0+1
  json_annotation: ^4.9.0
  widget_zoom: ^0.0.4
  animated_text_kit: ^4.2.3
  curved_carousel: ^0.0.8
  dotted_line: ^3.2.3
  m3_carousel: ^2.1.0
  fl_chart: ^1.1.1
  slider_button: ^2.1.0
  video_trimmer: ^5.0.0
  video_player: ^2.10.1
  appinio_video_player: ^1.2.2
  flutter_ruler_picker: ^1.0.6
  webview_flutter: ^4.13.1
  share_plus: ^7.2.2
  path_provider: ^2.1.2
  app_links: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  build_runner: ^2.5.4
  flutter_lints: ^5.0.0
  json_serializable: ^6.9.0
  # code generators — build-time only, must never ship in the app bundle
  freezed: ^2.5.7
  retrofit_generator: ^9.7.0
  injectable_generator: ^2.6.2
  # testing
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
dependency_overrides:
  vibration: ^3.1.5
  vibration_platform_interface: ^0.1.1

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/svgs/
    - assets/lottie/
    - assets/translations/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
